<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Login</title>
</head>
<body>
    <header>
        <nav>
            <h1 class="titulo">AgroTech</h1>
            <h3 class="texto">É muito bom ter você com a gente!</h3>
        </nav>
    </header>
    <main>
        <div class="form">
            <form action="/usuarios/login" method="post">
                <div class="elemento_form">
                    <label for="email" class="form_pergunta">Qual é o seu email?</label><br>
                    <input type="email" name="email" class="form_pergunta" placeholder= "joao@email.com"><br><br>
                </div>
                <div class="elemento_form">
                    <label for="senha" class="form_pergunta">Qual é a sua senha?</label><br>
                    <input type="password" name="senha" class="form_pergunta"><br><br>
                </div><br><br>

                <p id="mensagemErro"></p><br>
                
                <div class="elemento_form">
                    <button type="submit" class="btn">Logar</button>
                </div>
            </form>

            <br>

            <form action="/usuarios/cadastroUsuario" method="get" required>
                <button type="submit" class="btn">Não tem uma conta? Cadastre-se </button>
            </form>
            
            <br>

            <form action="/usuarios/emailRecuperarSenha" method="get" required>
                <button type="submit" class="btn">Esqueceu sua senha?</button>
            </form>
        </div>    
        <script src="/login.js"></script>    
    </main>
    <footer>
        <p>rodapé</p>
    </footer>
    
</body>
</html>
