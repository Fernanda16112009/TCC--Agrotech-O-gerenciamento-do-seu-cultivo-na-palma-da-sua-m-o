<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <div>
            <form action="/usuarios/email" method="post">
                <label>Digite seu email</label>
                <input type="email" name="email" class="form_pergunta" id="email" placeholder="joao@email.com" onchange="emailValido()"><br>
                <div class="error" id="email-invalido-erro">Seu email deve conter @...</div>                    
                <div class="error" id="email-obrigatorio">Email é obrigatório</div>
                <div class="error" id="email-existe-erro">Não existe uma conta com esse email</div><br><br>
                <button type="submit" class="btn" disabled ="true" id="btn_cadastro">Enviar email para a troca de senha</button>
            </form>
        </div>
    </main>
    <script src="/recuperarsenha.js"></script>
</body>
</html>
