<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro da planta</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
    <header>
        <h1 class="titulo">AgroTech</h1>
    </header>
    <main>
        <div class="cadastro">
            <form action="/" method="post">

                    <h3 class="nome_pagina">Cadastre sua planta</h3>

                    <div class="cadastro_form">
                        <label for="nome" class="nome_cadastro">Qual é a sua planta</label><br>
                        <select name="planta" id="nome_cadastro">

                        </select>
                    </div>

                    <button type="submit" class="btn_cadastro_usuario">Criar conta</button>
            </form>
        </div>
    </main>  
</body>
</html>
