<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1 class="titulo">AgroTech</h1>
    </header>
    <main>
        <div class="cadastro_Usuario_form">
            <form action="/usuarios" method="post">

                    <h3 class="subtitulo">Cadastro</h3><br>

                    <div class="cadastro_form">
                        <label for="nome" class="form_pergunta">Qual é o seu nome?</label><br>
                        <input type="text" name="nome" class="form_pergunta" placeholder="Ex:João da Silva" required><br><br>
                    </div>

                    <div class="cadastro_form">
                    <label for="email" class="form_pergunta">Qual é o seu email?</label><br>
                    <input type="email" name="email" class="form_pergunta" placeholder= "joao@email.com" required><br><br>
                    </div>

                    <div class="cadastro_form">
                    <label for="telefone" class="form_pergunta">Qual é o seu telefone?</label><br>
                    <input type="tel" name="telefone" class="form_pergunta" placeholder="Ex:(45) 99999-9999" required><br><br>
                    </div>

                    <div class="cadastro_form">
                    <label for="senha" class="form_pergunta">Crie uma senha forte</label><br>
                    <input type="password" name="senha" class="form_pergunta" placeholder="Mínimo 6 caracteres" required><br><br>
                    </div>

                    <div class="cadastro_form">
                    <label for="nome_usuario" class="form_pergunta">Crie um nome de usuário</label><br>
                    <input type="text" name="nome_usuario" class="form_pergunta" placeholder="Ex:joao1342" required><br><br><br>
                    </div>

                    
                    <button type="submit" class="btn_cadastro_usuario">Criar conta</button>
            </form>
        </div>
    </main>    
</body>
</html>
