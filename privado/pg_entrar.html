<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="/privado/privadoStyle.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-top">

                <form action="/privado/configuracoes" method="get">
                    <button class="icon-btn">
                        <img src="/privado/img/configura.png" alt="Configurações" class="icon-img">
                    </button>
                </form>
            </div>

            <h1 class="titulo">AgroTech</h1>
            <h3 class="subtitulo">Como posso te ajudar hoje?</h3>
        </nav>
    </header>

    <main>
        <div class="cadastro_form">
            <form action="/privado/escolherPlanta" method="get">
                <button class="btn_pg_inicial">
                    <img src="/privado/img/adicionar.png" alt="" class="btn-icon">
                    <span>Cadastrar Plantas</span>
                </button>
            </form>

            <form action="/planta/minhasPlantas" method="get">
                <button class="btn_pg_inicial">
                    <img src="/privado/img/cesta.png" alt="" class="btn-icon">
                    <span>Minhas Plantas</span>
                </button>
            </form>

            <form action="/privado/calendario" method="get">
                <button class="btn_pg_inicial">
                    <img src="/privado/img/calendario.png" alt="" class="btn-icon">
                    <span>Calendário</span>
                </button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-conteudo">
            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?
                <a href="mailto:agrotech@email.com">Entre em contato conosco</a>
            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>
        </div>
    </footer>
</body>
</html>
