<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/privado/privadoStyle.css">
    <title>Configurações</title>
</head>
<body>
    <header>
        <h1 class="titulo-pagina">Configurações</h1>
    </header>
    <main>
        <div class="cadastro_form">
            <form action="/priUsuarios/perfil" method="get" required>
                <button class="btn_pg_inicial btn_pg_inicial--texto"><span>Perfil</span></button>
            </form>
            <form action="/priUsuarios/sair" method="get" required>
                <button class="btn_pg_inicial btn_pg_inicial--texto btn_pg_inicial--perigo"><span>Sair</span></button>
            </form>
            <form action="/" method="get">
                <button class="btn-voltar" type="submit" title="Voltar">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </main>
    <footer>

        <div class="footer-conteudo">

            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?

            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>

        </div>

    </footer>
</body>
</html>
