<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instruções par o plantio</title>
    <link rel="stylesheet" href="/privado/privadoStyle.css">
    <script src="/js/vlibras.js" defer></script>
</head>
<body>
    <main>
        <div class="plantas-container">

            <h1 class="titulo-pagina">Instruções para o plantio</h1>
            <p class="subtitulo-pagina">Veja como e o que é necessário para plantar sua semente</p>

            <div class="plantas-grid">

                <form action="/privado/instrucoesPlantas/morangoAlbion" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/morangoAlb.png" alt="Morango Albion" class="card-icon">
                        <span>Morango Albion</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/morangoCaminoReal" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/morangoCam.png" alt="Morango Camino Real" class="card-icon">
                        <span>Morango Camino Real</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/morangoSanAndreas" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/morangoSan.png" alt="Morango San Andreas" class="card-icon">
                        <span>Morango San Andreas</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/cenouraTradicional" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/cenouraTrad.png" alt="Cenoura Tradicional" class="card-icon">
                        <span>Cenoura Tradicional</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/pepinoCaipira" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/pepinoCai.png" alt="Pepino Caipira" class="card-icon">
                        <span>Pepino Caipira</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/pepinoConserva" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/pepinoCon.png" alt="Pepino Conserva" class="card-icon">
                        <span>Pepino Conserva</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/pepinoJapones" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/pepinoJap.png" alt="Pepino Japones" class="card-icon">
                        <span>Pepino Japones</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/tomateCereja" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/tomateCer.png" alt="Tomate Cereja" class="card-icon">
                        <span>Tomate Cereja</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/tomateLongaVida" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/tomateLon.png" alt="Tomate Longa Vida" class="card-icon">
                        <span>Tomate Longa Vida</span>
                    </button>
                </form>

                <form action="/privado/instrucoesPlantas/tomateSaladete" method="get">
                    <button class="card-planta">
                        <img src="/privado/img/tomateSal.png" alt="Tomate Saladete" class="card-icon">
                        <span>Tomate Saladete</span>
                    </button>
                </form>

            </div>

            <button class="btn-voltar" type="button" title="Voltar" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

        </div>
    </main>
    <footer>

        <div class="footer-conteudo">

            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?
                <a href="mailto:agrotech@email.com">Entre em contato conosco</a>
            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>

        </div>

    </footer>

</html>
