<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Post</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1 class="titulo">AgroTech</h1>
    </header>
    <main>
        <div>
            <form action="/redeSocial/criarPostagem" method="post" enctype="multipart/form-data">
                <textarea name="post" id="post" class="post" rows="15"  placeholder="Compartilhe conselhos e dúvidas sobre suas plantas"></textarea><br><br>
                <input type="file" name="imagem" class="imagem"><br><br>
                <label for="text">Sobre qual Planta você está falando?</label><br><br>
                <select name="tipoPlanta">
                    <option value="tipoceno1">Tipo cenoura 1</option>
                    <option value="tipoceno2">Tipo cenoura 2</option>
                    <option value="tipoceno3">Tipo cenoura 3</option>
                    <option value="tipomora1">Tipo morango 1</option>
                    <option value="tipomora2">Tipo morango 2</option>
                    <option value="tipomora3">Tipo morango 3</option>
                    <option value="tipopepi1">Tipo pepino 1</option>
                    <option value="tipopepi2">Tipo pepino 2</option>
                    <option value="tipopepi3">Tipo pepino 3</option>
                    <option value="tipotom1">Tipo tomate 1</option>
                    <option value="tipotom2">Tipo tomate 1</option>
                    <option value="tipotom3">Tipo tomate 1</option>
                </select><br><br>
                <button type="submit">Postar</button>
            </form>
        </div>
    </main>
    <footer>
        <div class="footer-conteudo">

            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?
                <a href="mailto:agrotech@email.com">Entre em contato conosco</a>
            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>

        </div>

    </footer>
</body>
