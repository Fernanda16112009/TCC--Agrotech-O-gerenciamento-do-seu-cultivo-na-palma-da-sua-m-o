<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher o tipo de pepino</title>
    <link rel="stylesheet" href="/privado/privadoStyle.css">
    <script src="/js/vlibras.js" defer></script>
</head>
<body>
    <main>
        <div class="plantas-container">

            <h1 class="titulo-pagina">Qual tipo de pepino você irá plantar?</h1>

            <div class="plantas-grid">

                <form action="/privado/tipos/pepino/pepinoCaipira" method="get">
                    <button class="card-planta card-tipo card-tipo--pepino">
                        <img src="/privado/img/pepinoCai.png" alt="Pepino Caipira" class="card-icon">
                        <span>Pepino Caipira</span>
                        <small class="card-tipo-tag">Cadastrar</small>
                    </button>
                </form>

                <form action="/privado/tipos/pepino/pepinoConserva" method="get">
                    <button class="card-planta card-tipo card-tipo--pepino">
                        <img src="/privado/img/pepinoCon.png" alt="Pepino Conserva" class="card-icon">
                        <span>Pepino Conserva</span>
                        <small class="card-tipo-tag">Cadastrar</small>
                    </button>
                </form>

                <form action="/privado/tipos/pepino/pepinoJapones" method="get">
                    <button class="card-planta card-tipo card-tipo--pepino">
                        <img src="/privado/img/pepinoJap.png" alt="Pepino Japonês" class="card-icon">
                        <span>Pepino Japonês</span>
                        <small class="card-tipo-tag">Cadastrar</small>
                    </button>
                </form>

            </div>
            <form action="/" method="get">
                <button class="btn-voltar" type="submit" title="Voltar">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

        </div>
    </main>
    <footer>

        <div class="footer-conteudo">

            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?
                <a href="mailto:agrotech@email.com">Entre em contato conosco</a>
            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>

        </div>

    </footer>
</body>
</html>
