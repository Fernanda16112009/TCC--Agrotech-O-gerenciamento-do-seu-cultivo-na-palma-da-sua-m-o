                <form action="/privado/tipos/morango/morangoAlbino" method="get">
                    <button class="btn_pg_inicial">Morango Albino</button><br><br>
                </form>
            </div>

            <div class="tipoPlanta">
                <form action="/privado/tipos/morango/morangoCaminoReal" method="get">
                    <button class="btn_pg_inicial">Morango Camino Real</button><br><br>
                </form>
            </div>

            <div class="tipoPlanta">
                <form action="/privado/tipos/morango/morangoSanAndreas" method="get">
                    <button class="btn_pg_inicial">Morango San Andreas</button><br><br>
                </form>
            </div>
            <form action="/privado/escolherPlanta" method="get">
                <button class="btn_pg_inicial">Voltar</button><br><br>
            </form>
        </div>
    </main>
    <footer>
