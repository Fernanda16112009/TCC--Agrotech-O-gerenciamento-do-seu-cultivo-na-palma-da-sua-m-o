<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário</title>
    <link rel="stylesheet" href="/privado/calendario.css">
    <script src="/js/vlibras.js" defer></script>
</head>
<body>

    <header class="topo">
        <form action="/" method="get">
            <button type="submit" class="btn-voltar" title="Voltar" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>
    </header>

    <main>
        <div class="calendario-container">

            <h1 class="titulo-pagina">Calendário de plantio</h1>

            <div id="carregando" class="carregando">
                <div class="spinner"></div>
                <p>🌦️ Carregando calendário...</p>
            </div>

            <div class="nav-mes">
                <button type="button" class="seta" id="btn-prev" aria-label="Mês anterior">&lt;</button>
                <span class="titulo-mes" id="texto-mes">—</span>
                <button type="button" class="seta" id="btn-next" aria-label="Próximo mês">&gt;</button>
            </div>

            <table id="tabela-calendario" style="display: none;">
                <thead>
                    <tr>
                        <th class="red">D</th>
                        <th>S</th>
                        <th>T</th>
                        <th>Q</th>
                        <th>Q</th>
                        <th>S</th>
                        <th class="red">S</th>
                    </tr>
                </thead>
                <tbody id="corpo-calendario"></tbody>
            </table>

            <div id="botoes-calendario" class="botoes-calendario" style="display: none;">
                <div class="grid-botoes">
                    <button type="button" id="btn-abrir-popup-regas" class="btn_pg_inicial btn-largo">
                        💧 Conferir regas
                    </button>

                    <form action="/privado/areaDePragas" method="get">
                        <button type="submit" class="btn_pg_inicial">Área de pragas</button>
                    </form>

                    <form action="/privado/compostagem" method="get">
                        <button type="submit" class="btn_pg_inicial">Compostagem e adubação</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <div id="popup-regas" class="popup-fundo">
        <div class="popup">
            <button id="fechar-popup" class="fechar-popup" aria-label="Fechar">&times;</button>

            <h2>🌱 Atenção com suas plantas!</h2>

            <p id="mensagem-popup"></p>

            <div id="lista-plantas-popup"></div>
        </div>
    </div>

    <footer>
        <div class="footer-conteudo">
            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?
                <a href="mailto:agrotech@email.com">Entre em contato conosco</a>
            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>
        </div>
    </footer>

    <script src="/privado/calendario.js"></script>
</body>
</html>
