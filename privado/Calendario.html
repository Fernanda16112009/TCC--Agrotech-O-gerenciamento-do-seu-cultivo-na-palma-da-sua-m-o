<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário</title>
    <link rel="stylesheet" href="/privado/calendario.css">
</head>
<body>
    <main>
        <div class="calendario-container">

            <h1 class="titulo-pagina">Calendário de plantio</h1>

            <!--
            <div id="clima-info" class="clima">
                <span class="clima-temp">⏳ Iniciando sistemas...</span>
            </div>-->

            <div class="nav-mes">
                <span class="seta" id="btn-prev">&lt;</span>
                <span class="titulo-mes" id="texto-mes">Maio/2026</span>
                <span class="seta" id="btn-next">&gt;</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th class="red">D</th>
                        <th>S</th>
                        <th>T</th>
                        <th>Q</th>
                        <th>Q</th>
                        <th>S</th>
                        <th class="red">S</th>
                    </tr>
                </thead>
                <tbody id="corpo-calendario">
                </tbody>
            </table>

            <div class="botoes-calendario">
                <button type="button" id="btn-abrir-popup-regas" class="btn_pg_inicial">💧 Conferir regas</button>
                <form action="/" method="get" required>
                    <button class="btn_pg_inicial">Voltar</button>
                </form>
                <form action="/privado/areaDePragas" method="get" required>
                    <button class="btn_pg_inicial">Área de pragas</button>
                </form>
            </div>
        </div>     
    </main>

    <div id="popup-regas" class="popup-fundo">
        <div class="popup">
            <button id="fechar-popup" class="fechar-popup">&times;</button>

            <h2>🌱 Atenção com suas plantas!</h2>

            <p id="mensagem-popup"></p>

            <div id="lista-plantas-popup"></div>
        </div>
    </div>

    <footer>

        <div class="footer-conteudo">

            <h3>AgroTech</h3>

            <p>
                O gerenciamento do plantio na palma da sua mão.
            </p>

            <p>
                Sugestões, críticas ou dúvidas?
                <a href="mailto:agrotech@email.com">Entre em contato conosco</a>
            </p>

            <p class="copyright">
                © 2026 AgroTech. Todos os direitos reservados.
            </p>

        </div>

    </footer>

    <script src="/privado/calendario.js"></script>
</body>
</html>
