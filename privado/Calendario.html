<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Responsivo com Clima e Local</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image: url(FundoTCC.png);
            background-color: #e8f5e9; /* Cor de fundo caso a imagem não carregue */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calendario-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Estilos Atualizados da Barra de Clima --- */
        .clima {
            text-align: center;
            background-color: #c8e6c9;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .clima-cidade {
            font-size: 18px;
            font-weight: 800;
            color: #1b5e20;
        }

        .clima-temp {
            font-size: 22px;
            font-weight: 700;
            color: #2e7d32;
        }

        .clima-hora {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-top: 5px;
        }

        /* --- NOVO: Botão de Salvar --- */
        .btn-salvar {
            background-color: #2e7d32;
            color: white;
            border: 2px solid #000;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .btn-salvar:hover {
            background-color: #1b5e20;
        }

        /* --- Navegação e Calendário (Mantidos) --- */
        .nav-mes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .seta {
            font-size: 32px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            padding: 0 15px;
        }

        .titulo-mes {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
            background-color: #fff;
        }

        th, td {
            border: 2px solid #000;
            width: 14.28%;
        }

        th {
            background-color: #72af5b;
            padding: 10px 0;
            font-size: 22px;
            font-weight: 900;
            color: #000;
            text-align: center;
        }

        th.red {
            color: #d32f2f;
        }

        td {
            height: 60px;
            padding: 6px 8px;
            font-size: 18px;
            font-weight: 800;
            vertical-align: top;
            text-align: left;
        }

        td.inativo {
            color: #cfcfcf;
        }

        @media (max-width: 360px) {
            .titulo-mes { font-size: 26px; }
            .seta { font-size: 26px; }
            th { font-size: 18px; padding: 8px 0; }
            td { height: 50px; font-size: 16px; padding: 4px 6px; }
        }
    </style>
</head>
<body>

<div class="calendario-container">
    
    <!-- Painel de Clima -->
    <div id="clima-info" class="clima">
        <span class="clima-temp">⏳ Iniciando sistemas...</span>
        <!-- O botão e os dados vão aparecer aqui via JS -->
    </div>

    <div class="nav-mes">
        <span class="seta" id="btn-prev">&lt;</span>
        <span class="titulo-mes" id="texto-mes">Maio/2026</span>
        <span class="seta" id="btn-next">&gt;</span>
    </div>

    <table>
        <thead>
            <tr>
                <th class="red">D</th>
                <th>S</th>
                <th>T</th>
                <th>Q</th>
                <th>Q</th>
                <th>S</th>
                <th class="red">S</th>
            </tr>
        </thead>
        <tbody id="corpo-calendario">
        </tbody>
    </table>
</div>
<script src="Calendario.js"></script>
</body>
</html>
