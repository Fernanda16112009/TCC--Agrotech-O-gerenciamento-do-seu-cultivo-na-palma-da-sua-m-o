<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro da planta</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1 class="titulo">AgroTech</h1>
    </header>
    <main>
        <h3 class="subtitulo">Cadastre sua planta</h3>
        <div class="cadastro">
            <form action="/planta" method="post">

                <div class="cadastro_form">
                    <label for="tipoPlanta" class="form_pergunta">Qual é a sua planta?</label><br>
                    <select name="tipoPlanta">
                        <option value="">Selecione uma planta</option>
                        <option value="morango">Morango</option>
                        <option value="tomate">Tomate</option>
                        <option value="pepino">Pepino</option>
                        <option value="cenoura">Cenoura</option>
                    </select>
                </div><br>
                <div class="cadastro_form">
                    <label for="tipoPlanta" class="form_pergunta">Qual é a sua planta?</label><br>
                    <select name="tipoPlanta">
                        <option value="">Selecione uma planta</option>
                        <option value="morango">Morango</option>
                        <option value="tomate">Tomate</option>
                        <option value="pepino">Pepino</option>
                    </select>
                </div><br>

                <div class="cadastro_form">
                    <label for="quantidade" class="form_pergunta">Quantas sementes serão plantadas?</label><br>
                    <input type="text" name="quantidade" required>
                </div><br>

                <div class="cadastro_form">
                    <label for="localizacao" class="form_pergunta">Onde está localizado a sua planta? Certifique-se de que seu aparelho esteja no local da plantação</label><br>
                    <input type="hidden"  id="longitude" name="longitude" required>
                    <input type="hidden" id="latitude" name="latitude" required>
                    <button type="button" id="btn_mapa">Selecionar localização</button>

                    <p id="mensagemLocalizacao"></p>
                </div><br>

                <div class="cadastro_form">
                    <label for="data_plantacao" class="form_pergunta">Quando sua planta foi plantado?</label><br>
                    <input type="date" name="data_plantacao" required>
                </div><br>
                
                <div class="cadastro_form">
                    <label for="agrotoxico" class="form_pergunta">Será utilizado algum tipo de agrotóxico?</label><br>
                    <select name="agrotoxico">
                        <option value=""></option>
                        <option value="sim">Sim</option>
                        <option value="nao">Não</option>
                    </select>
                </div><br>

                <div>
                <button type="submit" class="btn_cadastro_usuario">Cadastrar planta</button>
                </div>
            </form>
            <form action="/planta/minhasPlantas" method="get">
                <button type="submit" class="btn_cadastro_usuario">Voltar</button>
            </form>
        </div>
    </main>
    <footer>
        <p>rodapé</p>
    </footer>
</body>
</html>

<script src="/privado/cadastroPlantaUsuario.js"></script>
